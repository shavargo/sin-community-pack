name: Build and Release Community Asset Pack

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: false
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        type: string
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build pak9_community.sin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build SPAK Archive
        shell: pwsh
        run: |
          ./tools/pack_spak.ps1 -InputDir . -OutputFile dist/pak9_community.sin

      - name: Compute SHA-256 Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path dist/pak9_community.sin -Algorithm SHA256).Hash
          Set-Content -Path dist/pak9_community.sin.sha256 -Value "$hash *pak9_community.sin"
          Write-Host "SHA256: $hash"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pak9_community
          path: |
            dist/pak9_community.sin
            dist/pak9_community.sin.sha256
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag_name }}
          name: SiN Community Pack ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag_name }}
          body: |
            ### SiN Community Multiplayer Asset Pack (`pak9_community.sin`)

            Consolidated and sanitized community asset pack containing:
            - **107 Community Multiplayer Maps** (DM, CTF, Rocket Arena, Wages of SiN)
            - **Custom Textures, Models, and Skyboxes**
            - **Announcer and In-game Audio Packs**
            - **Zero UI / Menu Hijacks** (Pure clean assets)

            #### Installation
            1. Download `pak9_community.sin` below.
            2. Place it in your `base/` directory alongside `pak0.sin`:
               ```
               SiN/
               └── base/
                   ├── pak0.sin
                   └── pak9_community.sin
               ```
            3. Launch `sin_client.exe` or `sin_ded.exe`.

            **SHA-256 Checksum:**
            See attached `pak9_community.sin.sha256`.
          files: |
            dist/pak9_community.sin
            dist/pak9_community.sin.sha256
            maplist.txt
