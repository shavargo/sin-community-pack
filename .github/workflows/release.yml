name: Build and Release Community Asset Pack

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: false
      tag_name:
        description: 'Release Tag (e.g. v1.0.2)'
        required: false
        type: string
        default: 'v1.0.2'

permissions:
  contents: write

jobs:
  build:
    name: Build Release Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Classic SPAK Archive (pak9_community.sin)
        shell: pwsh
        run: |
          ./tools/pack_spak.ps1 -InputDir . -OutputFile dist/pak9_community.sin

      - name: Build SiN Reloaded Zip Package (sin-reloaded-community.zip)
        shell: pwsh
        run: |
          $tempDir = Join-Path $env:RUNNER_TEMP "sin_reloaded_pack"
          if (Test-Path $tempDir) { Remove-Item $tempDir -Recurse -Force }
          $baseDir = Join-Path $tempDir "base"
          New-Item -ItemType Directory -Path $baseDir -Force | Out-Null
          
          $folders = @("demos", "maps", "models", "pics", "sound", "textures")
          foreach ($f in $folders) {
              if (Test-Path $f) {
                  Copy-Item -Path $f -Destination (Join-Path $baseDir $f) -Recurse -Force
              }
          }
          
          Compress-Archive -Path "$tempDir/base" -DestinationPath dist/sin-reloaded-community.zip -CompressionLevel Optimal
          Remove-Item $tempDir -Recurse -Force

      - name: Compute SHA-256 Checksums
        shell: pwsh
        run: |
          $hash9 = (Get-FileHash -Path dist/pak9_community.sin -Algorithm SHA256).Hash
          Set-Content -Path dist/pak9_community.sin.sha256 -Value "$hash9 *pak9_community.sin"
          $hashZip = (Get-FileHash -Path dist/sin-reloaded-community.zip -Algorithm SHA256).Hash
          Set-Content -Path dist/sin-reloaded-community.zip.sha256 -Value "$hashZip *sin-reloaded-community.zip"
          Write-Host "pak9_community.sin SHA256:         $hash9"
          Write-Host "sin-reloaded-community.zip SHA256: $hashZip"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sin-community-pack
          path: |
            dist/pak9_community.sin
            dist/pak9_community.sin.sha256
            dist/sin-reloaded-community.zip
            dist/sin-reloaded-community.zip.sha256
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag_name }}
          name: SiN Community Pack ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag_name }}
          body: |
            ### SiN Community Multiplayer Asset Pack

            Consolidated and sanitized community asset pack containing:
            - **36 Community Multiplayer Maps** (DM, CTF, Rocket Arena) with native in-game menu definitions
            - **Custom Textures, Models, and Skyboxes**
            - **Classic Announcer Audio Packs** (Blade, Elexis, JC, Custom)
            - **Zero Proprietary Files / Zero Commercial Retail Bloat**

            #### Installation

            **For SiN Reloaded (Nightdive Remaster):**
            1. Download **`sin-reloaded-community.zip`** below.
            2. Extract it directly into your `SiN Reloaded` installation directory (merges into `base/`):
               ```
               SiN Reloaded/
               └── base/
                   ├── maps/
                   ├── textures/
                   ├── sound/
                   └── models/
               ```
            3. Launch SiN Reloaded directly through Steam. All community maps appear in the Multiplayer host menu.

            **For Classic SiN / Wages of SiN / Source Ports:**
            1. Download **`pak9_community.sin`** below.
            2. Place it in your `SiN/base/` directory alongside `pak0.sin`:
               ```
               SiN/
               └── base/
                   ├── pak0.sin
                   └── pak9_community.sin
               ```
            3. Launch `sin.exe` or your dedicated server.

            **SHA-256 Checksums:**
            See attached `.sha256` files.
          files: |
            dist/pak9_community.sin
            dist/pak9_community.sin.sha256
            dist/sin-reloaded-community.zip
            dist/sin-reloaded-community.zip.sha256
            maplist.txt
